spring.application.name=naditech

# Server Port
server.port=8085

# Docker Compose Management (set to false to prevent startup crashes when Docker Desktop engine is not running)
spring.docker.compose.enabled=false


# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# Database Configuration (PostgreSQL Docker container)
spring.datasource.url=jdbc:postgresql://localhost:55432/financial_db
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver
# JWT Configuration
application.security.jwt.secret-key=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
application.security.jwt.expiration=86400000
# 7 days for mobile / web refresh token in milliseconds
application.security.jwt.refresh-token.expiration=604800000

# Security / Account Lockout policies (Fintech grade)
application.security.max-failed-attempts=5
application.security.lockout-duration-minutes=15

# SpringDoc OpenAPI Documentation
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
